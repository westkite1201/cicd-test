name: Build and Deploy Next.js App

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app code
        uses: actions/checkout@v3

      - name: Login to Harbor
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.HARBOR_URL }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.HARBOR_URL }}/my-apps/nextjs-app:${{ github.sha }}

      - name: Checkout manifest repo
        uses: actions/checkout@v3
        with:
          repository: your-github-username/manifest-repo-name # Manifest Repo 주소
          token: ${{ secrets.PAT }}
          path: 'manifest-repo'

      - name: Update Kubernetes manifest
        run: |
          sed -i 's|image: .*|image: ${{ secrets.HARBOR_URL }}/my-apps/nextjs-app:${{ github.sha }}|' manifest-repo/deployment.yaml
          cd manifest-repo
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add deployment.yaml
          git commit -m "Update image to ${{ github.sha }}"
          git push
