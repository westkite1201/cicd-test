# 워크플로우의 이름
name: CI Pipeline - Build and Push to Harbor

# 워크플로우가 실행될 조건 (트리거)
on:
  push:
    branches: [ master ] # 'main' 브랜치에 코드가 푸시될 때 실행

# 실제 작업들을 정의
jobs:
  build-and-push:
    # 작업이 실행될 가상 머신의 종류
    runs-on: ubuntu-latest
    
    # 작업의 단계들
    steps:
    # 1. 소스 코드 체크아웃 (내려받기)
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 2. Docker 빌드 환경 설정
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 3. Harbor에 로그인 (Secrets 사용)
    - name: Login to Harbor
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.HARBOR_REGISTRY_URL }}
        username: ${{ secrets.HARBOR_USERNAME }}
        password: ${{ secrets.HARBOR_PASSWORD }}

    # 4. Docker 이미지 빌드 및 Harbor에 푸시
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: . # Dockerfile이 있는 위치 (현재 디렉토리)
        push: true # 빌드 후 푸시 실행
        tags: ${{ secrets.HARBOR_REGISTRY_URL }}/my-apps/my-app:${{ github.sha }}

    # 5. Helm Chart 저장소 체크아웃
    - name: Checkout Helm Chart Repository
      uses: actions/checkout@v4
      with:
        repository: 'westkite1201/cicd-test-app-manifests'
        token: ${{ secrets.GH_PAT }}
        path: 'helm-charts-repo' # 임시 폴더에 클론

    # 6. Helm Chart의 values.yaml 파일 업데이트
    - name: Update Image Tag in values.yaml
      run: |
        sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq && sudo chmod +x /usr/bin/yq
        
        # '<차트경로>'를 실제 폴더 이름인 'my-app'으로 변경합니다.
        yq e '.image.tag = "${{ github.sha }}"' -i ./helm-charts-repo/my-app/values.yaml
        
        cd helm-charts-repo
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add .
        git commit -m "Update image tag to ${{ github.sha }}"
        git push
